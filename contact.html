<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6e69"><title>Contact — ModernEduMedia</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎓%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body data-page="contact">
<header id="siteHeader"></header>
<main id="main" class="section"><div class="container narrow"><h1>Contact</h1><p class="lead">Questions about classes, accounts or resources? Send a message and we will reply by email.</p>
<div class="grid grid-2"><form class="card" id="contactForm" novalidate><label>Full name<input name="name" required maxlength="200" autocomplete="name"></label><label>Email<input type="email" name="email" required maxlength="320" autocomplete="email"></label>
<label>Subject <span class="muted" style="font-weight:400">(optional)</span><input name="subject" maxlength="300" list="subjectIdeas" placeholder="e.g. Account help"><datalist id="subjectIdeas"><option value="Account help"><option value="Live class question"><option value="Resources and notes"><option value="Teacher registration"><option value="Feedback"></datalist></label>
<label>Message<textarea name="message" rows="6" required maxlength="5000"></textarea></label><p class="form-msg" id="formMsg" role="status" aria-live="polite"></p><button class="btn btn-primary full" id="sendBtn">Send message</button></form>
<div><div class="card"><h3>Email</h3><a href="mailto:castrootienocommercial@gmail.com">castrootienocommercial@gmail.com</a></div><div class="card" style="margin-top:20px"><h3>WhatsApp</h3><a href="https://wa.me/254741637904" target="_blank" rel="noopener">+254 741 637 904</a></div></div></div></div></main>
<footer id="siteFooter"></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/contact.js"></script></body></html>
