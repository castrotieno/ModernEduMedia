<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6e69"><title>Register — ModernEduMedia</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎓%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body data-page="register">
<header id="siteHeader"></header>
<main id="main" class="auth-page"><form class="card auth-card" id="registerForm"><h1>Create account</h1><label>Full name<input name="full_name" required autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><label>Register as<select name="role"><option value="student">Student</option><option value="teacher">Teacher (needs admin approval)</option></select></label><label>Class<select name="class_id" id="classSelect"><option value="">Select class</option></select></label><button class="btn btn-primary full">Create account</button><p class="muted center" style="margin-top:14px">Already registered? <a href="login.html"><u>Sign in</u></a></p></form></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script src="assets/js/auth.js"></script></body></html>
